
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>HUOMO | Barbería</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101010;
      color: #f5f2eb;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    header {
      padding: 26px 20px;
      border-bottom: 1px solid #292929;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 5px;
    }
    .status {
      color: #c7a66a;
      font-size: 11px;
      letter-spacing: 1px;
    }
    main { padding: 22px 18px; max-width: 650px; margin: auto; }
    .eyebrow {
      color: #c7a66a;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    h1 { font-size: 28px; margin: 9px 0; }
    .sub { color: #929292; font-size: 14px; margin-bottom: 24px; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .card {
      background: #191919;
      border: 1px solid #303030;
      border-radius: 13px;
      padding: 17px;
      margin-bottom: 13px;
    }
    .stat-label { color: #a4a4a4; font-size: 12px; }
    .stat-value { font-size: 24px; font-weight: 700; margin-top: 9px; }
    .gold { color: #c7a66a; }
    h2 { font-size: 17px; margin: 8px 0 17px; }
    label {
      display: block;
      font-size: 12px;
      color: #bdbdbd;
      margin: 13px 0 7px;
    }
    input, select {
      width: 100%;
      background: #101010;
      color: #fff;
      border: 1px solid #393939;
      border-radius: 8px;
      padding: 13px;
      font-size: 16px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 15px;
      margin-top: 17px;
      background: #c7a66a;
      color: #101010;
      font-size: 14px;
      font-weight: 800;
    }
    .empty { color: #888; font-size: 13px; text-align: center; padding: 18px 0; }
    .sale {
      border-top: 1px solid #303030;
      padding: 13px 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .sale small { display: block; color: #999; margin-top: 5px; }
    footer { text-align: center; color: #666; font-size: 11px; padding: 25px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">HUOMO</div>
    <div class="status">● PANEL DE GESTIÓN</div>
  </header>

  <main>
    <div class="eyebrow">BARBERÍA · ADMINISTRACIÓN</div>
    <h1>Panel de control</h1>
    <p class="sub" id="fecha"></p>

    <div class="stats">
      <div class="card">
        <div class="stat-label">Ingresos del día</div>
        <div class="stat-value gold" id="ingresos">$0</div>
      </div>
      <div class="card">
        <div class="stat-label">Cortes registrados</div>
        <div class="stat-value" id="cantidad">0</div>
      </div>
    </div>

    <section class="card" style="margin-top:10px">
      <h2>＋ Registrar un corte</h2>
      <form id="formulario">
        <label for="cliente">Nombre del cliente</label>
        <input id="cliente" placeholder="Ej. Martín" required>

        <label for="servicio">Servicio</label>
        <select id="servicio">
          <option>Corte</option>
          <option>Corte + barba</option>
          <option>Barba</option>
          <option>Otro servicio</option>
        </select>

        <label for="barbero">Barbero</label>
        <input id="barbero" placeholder="Nombre del barbero" required>

        <label for="importe">Importe ($)</label>
        <input id="importe" type="number" min="1" step="1" placeholder="Ej. 12000" required>

        <label for="pago">Medio de pago</label>
        <select id="pago">
          <option>Efectivo</option>
          <option>Mercado Pago</option>
          <option>Transferencia bancaria</option>
          <option>Tarjeta</option>
        </select>

        <button type="submit">GUARDAR CORTE</button>
      </form>
    </section>

    <section class="card">
      <h2>Últimos movimientos</h2>
      <div id="movimientos" class="empty">Todavía no hay cortes registrados.</div>
    </section>
  </main>

  <footer>HUOMO · SISTEMA DE GESTIÓN</footer>

  <script>
    const clave = "huomo_cortes_v1";
    const dinero = n => new Intl.NumberFormat("es-AR", {
      style: "currency", currency: "ARS",
      maximumFractionDigits: 0
    }).format(n);

    document.getElementById("fecha").textContent =
      new Date().toLocaleDateString("es-AR", {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      });

    let cortes = [];
    try {
      cortes = JSON.parse(localStorage.getItem(clave) || "[]");
    } catch (e) {
      cortes = [];
    }

    function mostrar() {
      const hoy = new Date().toLocaleDateString("en-CA");
      const delDia = cortes.filter(c => c.fecha === hoy);
      document.getElementById("ingresos").textContent =
        dinero(delDia.reduce((s, c) => s + c.importe, 0));
      document.getElementById("cantidad").textContent = delDia.length;

      const zona = document.getElementById("movimientos");
      if (!cortes.length) {
        zona.className = "empty";
        zona.textContent = "Todavía no hay cortes registrados.";
        return;
      }

      zona.className = "";
      zona.replaceChildren();
      cortes.slice().reverse().forEach(c => {
        const fila = document.createElement("div");
        fila.className = "sale";
        const detalle = document.createElement("div");
        const nombre = document.createElement("strong");
        nombre.textContent = c.cliente;
        const info = document.createElement("small");
        info.textContent = c.servicio + " · " + c.barbero + " · " + c.pago;
        detalle.append(nombre, info);
        const precio = document.createElement("strong");
        precio.className = "gold";
        precio.textContent = dinero(c.importe);
        fila.append(detalle, precio);
        zona.append(fila);
      });
    }

    document.getElementById("formulario").addEventListener("submit", e => {
      e.preventDefault();
      const cliente = document.getElementById("cliente").value.trim();
      const barbero = document.getElementById("barbero").value.trim();
      const importe = Number(document.getElementById("importe").value);

      if (!cliente || !barbero || !Number.isFinite(importe) || importe <= 0) {
        alert("Revisá los datos del corte.");
        return;
      }

      cortes.push({
        cliente,
        servicio: document.getElementById("servicio").value,
        barbero,
        importe,
        pago: document.getElementById("pago").value,
        fecha: new Date().toLocaleDateString("en-CA")
      });

      try {
        localStorage.setItem(clave, JSON.stringify(cortes));
      } catch (err) {
        alert("No se pudieron guardar los datos en este navegador.");
        cortes.pop();
        return;
      }

      e.target.reset();
      mostrar();
      alert("Corte registrado correctamente.");
    });

    mostrar();
  </script>
</body>
</html>
